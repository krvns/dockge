# Build and run a production Dockge image from local source.
# Configuration: copy .env.example → .env (Compose loads .env automatically)
#
# Usage:
#   cp .env.example .env   # once
#   mkdir -p stacks data
#   docker compose -f compose.yaml up -d --build --cap-drop=ALL
#
# Stacks bind: host path must equal container path (Docker-via-socket).
# Default bind is $PWD/stacks. Override with DOCKGE_STACKS_BIND in .env
# (absolute path). DOCKGE_STACKS_DIR in .env is for npm run dev only.

services:
  dockge:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    image: ${DOCKGE_IMAGE:-dockge:local}
    restart: unless-stopped
    ports:
      - "${NETBIRD_IP:-127.0.0.1}:${DOCKGE_HOST_PORT:-5001}:${DOCKGE_PORT:-5001}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKGE_DATA_DIR}:/app/data
      - ${DOCKGE_STACKS_BIND:-$PWD/stacks}:${DOCKGE_STACKS_BIND:-$PWD/stacks}
    environment:
      DOCKGE_PORT: ${DOCKGE_PORT}
      DOCKGE_DATA_DIR: /app/data
      DOCKGE_STACKS_DIR: ${DOCKGE_STACKS_BIND:-$PWD/stacks}
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
